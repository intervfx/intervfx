<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervfx — Вся полезная информация обо мне</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Анимированный чёрно-белый фон */
        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.07), transparent 40%),
                radial-gradient(circle at 70% 70%, rgba(255,255,255,0.05), transparent 40%);
            animation: bgMove 12s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes bgMove {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(4%, -4%) scale(1.15); }
        }

        .container {
            text-align: center;
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: fadeDown 0.8s ease both, glowPulse 3s ease-in-out 1s infinite;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 8px rgba(255,255,255,0.3); }
            50%      { text-shadow: 0 0 25px rgba(255,255,255,0.8); }
        }

        .subtitle {
            font-size: 1.1rem;
            color: #9a9a9a;
            margin-bottom: 40px;
            animation: fadeIn 1s ease 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 260px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            background: #0d0d0d;
            border: 1px solid #3a3a3a;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease both;
        }

        .btn:nth-child(1) { animation-delay: 0.5s; }
        .btn:nth-child(2) { animation-delay: 0.7s; }
        .btn:nth-child(3) { animation-delay: 0.9s; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Бегущий блик */
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        /* Пульсирующая рамка при наведении */
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 12px;
            border: 1px solid #fff;
            opacity: 0;
            pointer-events: none;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            background: #fff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            animation: btnShake 0.4s ease;
        }

        .btn:hover::after {
            animation: ringPulse 1.2s ease-out infinite;
        }

        @keyframes btnShake {
            0%, 100% { transform: translateY(-3px) scale(1.05) rotate(0); }
            25%      { transform: translateY(-3px) scale(1.05) rotate(-1deg); }
            75%      { transform: translateY(-3px) scale(1.05) rotate(1deg); }
        }

        @keyframes ringPulse {
            0%   { opacity: 0.8; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.15); }
        }

        .btn:active {
            transform: translateY(0) scale(0.97);
        }

        footer {
            margin-top: 60px;
            font-size: 0.85rem;
            color: #5c5c5c;
            position: relative;
            z-index: 1;
            animation: fadeIn 1.2s ease 1.2s both;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Intervfx</h1>
        <p class="subtitle">Вся полезная информация обо мне</p>

        <div class="buttons">
            <a href="https://discord.com/users/inter.vfx" class="btn" target="_blank">Discord</a>
            <a href="https://t.me/intervfx" class="btn" target="_blank">Telegram</a>
            <a href="https://steamcommunity.com/profiles/76561198772538929/" class="btn" target="_blank">Steam</a>
        </div>
    </div>

    <footer>
        © 2026 intervfx. Все права защищены организацией WM.
    </footer>
</body>
</html>

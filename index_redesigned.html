<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Intervfx — ссылки и полезная информация обо мне.">
  <title>Intervfx — links</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --panel: rgba(255,255,255,.045);
      --line: rgba(255,255,255,.13);
      --muted: #929292;
      --white: #f5f5f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      padding: 42px 20px 28px;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.095), transparent 38%),
        radial-gradient(ellipse at 12% 90%, rgba(255,255,255,.035), transparent 32%),
        var(--bg);
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
    }

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(255,255,255,.055);
      filter: blur(100px);
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: -1;
      animation: breathe 7s ease-in-out infinite alternate;
    }

    .page {
      width: min(100%, 540px);
      text-align: center;
      animation: appear .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      color: #777;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      animation: appear 1s .1s both;
    }

    .topline::before, .topline::after {
      content: "";
      width: 28px;
      height: 1px;
      background: #555;
    }

    .monogram {
      width: 76px;
      height: 76px;
      margin: 0 auto 23px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.015));
      box-shadow: 0 18px 60px rgba(0,0,0,.4), inset 0 1px rgba(255,255,255,.12);
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -.09em;
      animation: float 5s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.8rem, 11vw, 4.8rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 850;
      text-transform: uppercase;
    }

    h1 span {
      display: inline-block;
      background: linear-gradient(180deg, #fff 15%, #888 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 17px 0 34px;
      color: var(--muted);
      font-size: .98rem;
      letter-spacing: .015em;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 13px;
      color: #777;
      font-size: .67rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-align: left;
      text-transform: uppercase;
    }

    .section-label::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, var(--line), transparent);
    }

    .links {
      display: grid;
      gap: 11px;
    }

    .link-card {
      --delay: 0s;
      position: relative;
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      min-height: 76px;
      padding: 13px 17px;
      overflow: hidden;
      color: var(--white);
      text-decoration: none;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: linear-gradient(115deg, rgba(255,255,255,.075), rgba(255,255,255,.018));
      box-shadow: 0 8px 30px rgba(0,0,0,.16);
      backdrop-filter: blur(12px);
      transition: transform .28s ease, border-color .28s ease, background .28s ease, box-shadow .28s ease;
      opacity: 0;
      animation: rise .7s cubic-bezier(.2,.8,.2,1) var(--delay) forwards;
    }

    .link-card::before {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-120%);
      background: linear-gradient(105deg, transparent 25%, rgba(255,255,255,.12) 50%, transparent 75%);
      transition: transform .7s ease;
      pointer-events: none;
    }

    .link-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,.48);
      background: linear-gradient(115deg, rgba(255,255,255,.13), rgba(255,255,255,.045));
      box-shadow: 0 16px 42px rgba(0,0,0,.35), 0 0 25px rgba(255,255,255,.055);
    }

    .link-card:hover::before { transform: translateX(120%); }
    .link-card:active { transform: translateY(-1px) scale(.99); }

    .icon-box {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 13px;
      background: rgba(255,255,255,.075);
      transition: background .25s ease, transform .25s ease;
    }

    .link-card:hover .icon-box {
      background: #f2f2f2;
      color: #080808;
      transform: rotate(-5deg);
    }

    .icon-box svg { width: 21px; height: 21px; fill: currentColor; }

    .link-copy { display: grid; gap: 4px; flex: 1; }
    .link-title { font-size: .98rem; font-weight: 700; letter-spacing: .01em; }
    .link-description { color: #858585; font-size: .76rem; }

    .arrow {
      color: #777;
      font-size: 1.2rem;
      transition: color .25s ease, transform .25s ease;
    }

    .link-card:hover .arrow { color: #fff; transform: translate(3px,-3px); }

    footer {
      margin-top: 38px;
      color: #666;
      font-size: .72rem;
      letter-spacing: .04em;
      animation: appear 1s .8s both;
    }

    footer strong { color: #aaa; font-weight: 600; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes breathe {
      from { opacity: .55; transform: translateX(-50%) scale(.9); }
      to { opacity: 1; transform: translateX(-50%) scale(1.12); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @media (max-width: 480px) {
      body { padding: 32px 17px 22px; }
      .topline { margin-bottom: 25px; }
      .monogram { width: 68px; height: 68px; border-radius: 21px; }
      .subtitle { margin-bottom: 29px; }
      .link-card { min-height: 72px; padding: 12px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
      .link-card { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main class="page">
    <div class="topline">Personal page</div>
    <div class="monogram" aria-hidden="true">IV.</div>

    <h1><span>Intervfx</span></h1>
    <p class="subtitle">Вся полезная информация обо мне</p>

    <div class="section-label">Мои социальные сети</div>
    <nav class="links" aria-label="Социальные сети">
      <a class="link-card" style="--delay:.15s" href="https://discord.com/users/inter.vfx" target="_blank" rel="noopener noreferrer">
        <span class="icon-box" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M19.7 5.2A18.6 18.6 0 0 0 15.1 3.8l-.6 1.2a17 17 0 0 0-5 0l-.6-1.2a18.6 18.6 0 0 0-4.6 1.4C1.4 9.5.6 13.7 1 17.8a18.7 18.7 0 0 0 5.7 2.9l1.2-2a12 12 0 0 1-1.9-.9l.5-.4a13.3 13.3 0 0 0 11 0l.5.4a12 12 0 0 1-1.9.9l1.2 2a18.7 18.7 0 0 0 5.7-2.9c.5-4.8-.8-8.9-3.3-12.6ZM8.7 15.4c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2Zm6.6 0c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2Z"/></svg>
        </span>
        <span class="link-copy">
          <span class="link-title">Discord</span>
          <span class="link-description">Связаться и пообщаться</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link-card" style="--delay:.3s" href="https://t.me/intervfx" target="_blank" rel="noopener noreferrer">
        <span class="icon-box" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21.8 4.2 18.5 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.6l-4.9-1.5c-1.1-.3-1.1-1 .2-1.5L20 3.1c.9-.3 2.1.2 1.8 1.1Z"/></svg>
        </span>
        <span class="link-copy">
          <span class="link-title">Telegram</span>
          <span class="link-description">Новости, сообщения и проекты</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link-card" style="--delay:.45s" href="https://steamcommunity.com/profiles/76561198772538929/" target="_blank" rel="noopener noreferrer">
        <span class="icon-box" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-9.9 8.6l5.4 2.2a3.2 3.2 0 0 1 1.8-.6l2.4-3.5v-.1a4.2 4.2 0 1 1 4.2 4.2h-.1l-3.5 2.5a3.2 3.2 0 0 1-6.3.7l-3.8-1.5A10 10 0 1 0 12 2Zm4.1 9.2a2.5 2.5 0 1 0-2.5-2.5 2.5 2.5 0 0 0 2.5 2.5ZM9.3 17.5a1.9 1.9 0 0 0 1.8-1.3l-2.7-1.1a1.9 1.9 0 0 0 .9 2.4Z"/></svg>
        </span>
        <span class="link-copy">
          <span class="link-title">Steam</span>
          <span class="link-description">Мой игровой профиль</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <footer>© 2026 <strong>Intervfx</strong> · Все права защищены организацией WM</footer>
  </main>
</body>
</html>
